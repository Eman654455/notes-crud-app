<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes & Blog CRUD App | CognoRise Internship</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fa-solid fa-note-sticky"></i> Notes & Blog Manager</h1>
            <p>CognoRise Infotech Web Development Internship - Project 4</p>
        </div>
    </header>

    <main class="container main-content">
        <!-- Search & Filter Section -->
        <section class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search notes by title or keyword...">
            </div>
        </section>

        <div class="app-grid">
            <!-- Form Section -->
            <section class="form-section">
                <div class="card form-card">
                    <h2 id="formTitle"><i class="fa-solid fa-pen-to-square"></i> Add New Note</h2>
                    <form id="noteForm">
                        <input type="hidden" id="noteId">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" placeholder="Enter note title..." required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description / Content</label>
                            <textarea id="description" rows="5" placeholder="Write your note or blog content here..." required></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            <i class="fa-solid fa-plus"></i> Save Note
                        </button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary hidden">
                            Cancel Edit
                        </button>
                    </form>
                </div>
            </section>

            <!-- Notes Display Section -->
            <section class="notes-section">
                <h2><i class="fa-solid fa-list"></i> Your Notes</h2>
                <div id="notesContainer" class="notes-grid">
                    <!-- Dynamic Notes will appear here -->
                </div>
                <div id="emptyMessage" class="empty-message hidden">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>No notes found. Create your first note!</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Notes CRUD App | Built for CognoRise Infotech Internship</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
